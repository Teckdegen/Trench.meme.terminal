# Fly.io app for the frontend (TanStack Start runs on Node).
# Deploy with:
#   fly launch --copy-config --name monad-terminal-web --no-deploy
#   fly secrets set NADFUN_API_KEY=... SUPABASE_JWT_SECRET=... \
#     LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=...
#   fly deploy --config fly.web.toml --dockerfile Dockerfile.web
app  = "monad-terminal-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[http_service]
  internal_port      = 3000
  force_https        = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size      = "shared-cpu-1x"
  memory_mb = 512
