[build]
command = "npm run build"
publish = "dist/client"

[build.environment]
NODE_VERSION = "22.13.0"
NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://plausible.io https://*.plausible.io https://challenges.cloudflare.com https://app.getpara.com https://*.getpara.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data: blob:; media-src 'self' blob:; worker-src 'self' blob: data:; frame-src 'self' https://app.getpara.com https://*.getpara.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"
